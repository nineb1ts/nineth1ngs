name: Feature request
description: Suggest an idea or improvement for nineth1ngs
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why would it be useful?
      description: What problem would this solve or make easier?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples, or anything else that helps explain the idea.
