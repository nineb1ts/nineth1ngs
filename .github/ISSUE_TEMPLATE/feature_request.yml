name: Feature request
description: Suggest an idea or improvement for nineth1ngs
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or frustration behind the request.
      placeholder: What would become easier with this feature?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or behavior you have in mind.
      placeholder: Explain how you imagine it working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways you currently solve this?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or anything else that helps explain the idea.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that a similar feature request does not already exist.
          required: true